name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      source_sha256:
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/waymark
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Download verified release source
        env:
          EXPECTED_HASH: ${{ inputs.source_sha256 }}
        run: |
          gh release download v0.1.3 --repo $env:GITHUB_REPOSITORY --pattern waymark-source-0.1.3.tar.gz
          if ((Get-FileHash waymark-source-0.1.3.tar.gz -Algorithm SHA256).Hash.ToLower() -ne $env:EXPECTED_HASH) { throw 'Source checksum mismatch' }
          New-Item -ItemType Directory app
          tar -xzf waymark-source-0.1.3.tar.gz -C app
          "WAYMARK_SOURCE_ARCHIVE=$((Resolve-Path waymark-source-0.1.3.tar.gz).Path)" >> $env:GITHUB_ENV
      - name: Install pinned dependencies
        working-directory: app
        run: |
          corepack enable
          corepack yarn install --immutable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop/runtime-deps
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build bundled Windows runtime
        working-directory: app
        run: node desktop/prepare.mjs
      - name: Build installer
        working-directory: app
        run: npm --prefix desktop run package:windows
      - name: Install and test the actual installer
        working-directory: app
        run: |
          $installer = (Resolve-Path 'desktop/dist/Waymark-0.1.3-Windows-x64-Setup.exe').Path
          $destination = Join-Path $env:RUNNER_TEMP 'Waymark Installed'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $env:WAYMARK_APP_EXECUTABLE = Join-Path $destination 'Waymark.exe'
          if (!(Test-Path $env:WAYMARK_APP_EXECUTABLE)) { throw 'Installed executable missing' }
          node desktop/smoke.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload verified installer
        working-directory: app/desktop/dist
        run: |
          $file = 'Waymark-0.1.3-Windows-x64-Setup.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Out-File -Encoding ascii SHA256SUMS-Windows.txt
          gh release upload v0.1.3 $file SHA256SUMS-Windows.txt --repo $env:GITHUB_REPOSITORY --clobber
      - name: Preserve diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-diagnostics
          path: |
            app/desktop/dist/builder-debug.yml
            ${{ runner.temp }}/waymark-desktop-test-*/startup.log
          retention-days: 3
