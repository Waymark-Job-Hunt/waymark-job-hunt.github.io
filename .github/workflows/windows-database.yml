name: Windows database diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  database:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - run: npm install embedded-postgres@18.6.0-beta.19
      - name: Diagnose database startup
        run: |
          @'
          const {default: EmbeddedPostgres} = await import('embedded-postgres');
          const {spawn}=await import('node:child_process');
          const fs=await import('node:fs/promises');
          const path=await import('node:path');
          const dbdir=path.resolve('test-database');
          const db=new EmbeddedPostgres({databaseDir:dbdir,user:'waymark',password:'temporary-test-only',port:54329,persistent:true,authMethod:'scram-sha-256',initdbFlags:['--encoding=UTF8','--locale=C'],postgresFlags:['-h','127.0.0.1','-c','max_connections=30','-c','shared_buffers=64MB'],onLog:console.log,onError:console.error});
          await db.initialise();
          const ctl=path.resolve('node_modules/@embedded-postgres/windows-x64/native/bin/pg_ctl.exe');
          const log=path.resolve('pg.log');
          const run=args=>new Promise((resolve,reject)=>{const child=spawn(ctl,args,{stdio:'ignore',windowsHide:true});child.on('error',reject);child.on('exit',code=>code===0?resolve():reject(Error('pg_ctl exit '+code)));});
          await run(['-D',dbdir,'-w','-t','20','-l',log,'-o','-h 127.0.0.1 -p 54329 -c max_connections=30 -c shared_buffers=64MB','start']);
          const {Client}=await import('pg');
          const client=new Client({host:'127.0.0.1',port:54329,user:'waymark',password:'temporary-test-only',database:'postgres'});
          await client.connect(); await client.query('SELECT 1'); await client.end();
          await run(['-D',dbdir,'-m','fast','-w','-t','10','stop']);
          console.log('PASS: native Windows launcher, authenticated query, clean shutdown.');
          process.exit(0);
          '@ | Set-Content database-test.mjs
          node database-test.mjs
